name: ci

on:
  push:
    branches: [main]
  # Sin filtro de rama base: los PR apilados tambien deben pasar la CI.
  pull_request:
  workflow_dispatch:

# Minimo privilegio: la CI solo lee el repositorio.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sincronizar entorno (desde uv.lock)
        run: uv sync --frozen --all-extras --python ${{ matrix.python }}

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Formato (ruff)
        run: uv run ruff format --check .

      - name: Tipos (ty)
        # --all-extras: 'uv run' re-sincroniza sin extras y ty no resolveria
        # tiktoken ni yt-dlp (imports opcionales).
        run: uv run --all-extras ty check src

      - name: Pruebas (pytest)
        run: uv run pytest

      - name: Demo offline del pipeline
        run: uv run python scripts/demo_offline.py
