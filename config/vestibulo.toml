# Hitos del Vestíbulo de la Sucursal 1965 (PR 17).
#
# Cada hito sale de la línea de tiempo de la página pública "Nuestro Banco"
# (data/gold/pages/nuestro-banco-banco-de-occidente-4f58e4.md) y enlaza a esa
# fuente. La API los sirve tal cual en GET /api/vestibulo, y
# app/web/datos-ejemplo/vestibulo.json debe repetir exactamente esta lista
# (lo comprueba test/test_web_vestibulo.py).
#
# Para agregar un hito: copia un bloque [[hito]], usa un año entero, un texto
# corto fiel a la fuente y una URL que exista en data/gold/corpus.jsonl.

[[hito]]
anio = 1965
texto = "Nace el Banco de Occidente en Cali, el 3 de mayo, con el lema «el banco que lo conoce a usted»."
url = "https://www.bancodeoccidente.com.co/quienes-somos/nuestro-banco"

[[hito]]
anio = 1970
texto = "Abre sus primeras oficinas fuera de Cali, en Palmira, Pereira y Armenia, y llega a 15 oficinas."
url = "https://www.bancodeoccidente.com.co/quienes-somos/nuestro-banco"

[[hito]]
anio = 1973
texto = "Inicia una nueva etapa bajo la orientación del Grupo Económico Sarmiento Angulo."
url = "https://www.bancodeoccidente.com.co/quienes-somos/nuestro-banco"

[[hito]]
anio = 1976
texto = "Lanza su propio sistema de tarjeta de crédito: Credencial."
url = "https://www.bancodeoccidente.com.co/quienes-somos/nuestro-banco"

[[hito]]
anio = 1982
texto = "Nace el Banco de Occidente Panamá, filial del banco en Colombia."
url = "https://www.bancodeoccidente.com.co/quienes-somos/nuestro-banco"

[[hito]]
anio = 1991
texto = "Nace la filial Fiduciaria de Occidente."
url = "https://www.bancodeoccidente.com.co/quienes-somos/nuestro-banco"

[[hito]]
anio = 1993
texto = "Crea el Premio Nacional de Ecología Planeta Azul, dedicado al cuidado del agua."
url = "https://www.bancodeoccidente.com.co/quienes-somos/nuestro-banco"

[[hito]]
anio = 1998
texto = "Entra a formar parte del Grupo Aval, junto con los bancos AV Villas, Bogotá y Popular."
url = "https://www.bancodeoccidente.com.co/quienes-somos/nuestro-banco"

[[hito]]
anio = 2004
texto = "Adquiere el Banco Aliadas y suma las líneas de vehículos, seguros y motos."
url = "https://www.bancodeoccidente.com.co/quienes-somos/nuestro-banco"

[[hito]]
anio = 2012
texto = "Crea una nueva unidad de negocio para financiar vivienda."
url = "https://www.bancodeoccidente.com.co/quienes-somos/nuestro-banco"

[[hito]]
anio = 2019
texto = "Renueva su lema y pasa a estar «Del lado de los que hacen»."
url = "https://www.bancodeoccidente.com.co/quienes-somos/nuestro-banco"

[[hito]]
anio = 2022
texto = "Se adhiere al Pacto Global de las Naciones Unidas y publica su primer informe de sostenibilidad GRI."
