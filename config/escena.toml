# Escena demo «Pana vs. el gota a gota»: parámetros de Don Gota.
#
# Don Gota es un personaje ficticio. Este archivo no contiene secretos ni datos
# personales. Las fórmulas viven en `escena/gota.py` y se aplican en `Decimal`:
# el interés es mensual y simple, sin capitalizar, para que la comparación de
# 36 meses sea defendible. La tasa E.A. es la equivalente compuesta del 20 %
# mensual: (1,20)^12 - 1 = 791,61 % E.A.
#
# Las secciones de los demás dueños ([comparacion], [negociacion], [auditor],
# [voluntario], [seguro] y [ui]) se añaden en sus tareas; este archivo no las
# declara vacías para no pisar su trabajo.

[gota]
# Tasa mensual que cobra el personaje, como fracción (0,20 = 20 %).
tasa_mensual = 0.20
# Días del ciclo de cobro; la cuota diaria reparte el total del ciclo.
dias_ciclo = 30
# Meses del horizonte que se comparan con el banco y con la usura.
meses_horizonte = 36

[gota.frases]
# Cada grupo elige una frase por índice determinista (SHA-256 del perfil) y
# rellena solo estas variables: monto, tasa_mensual, interes_mensual,
# total_ciclo, cuota_diaria y dias_ciclo. Don Gota vende lo fácil: no dice la
# tasa E.A., ni los totales de 36 meses, ni el supuesto de renovación; esas
# cifras las revela Pana. Los turnos de Don Gota son origen="guion_fijo":
# nunca los genera un modelo.
oferta = [
  "¿Necesitas {monto}? Te los presto hoy. Solo el {tasa_mensual} al mes: me devuelves {total_ciclo} en {dias_ciclo} días, sin papeles.",
  "Por {monto} no hay papeleo: solo el {tasa_mensual} al mes. En {dias_ciclo} días me pagas {total_ciclo} y sigues.",
  "Te presto {monto} y me pagas {total_ciclo} dentro de {dias_ciclo} días. Solo el {tasa_mensual} al mes y sin papeles.",
]
presion_diaria = [
  "Son solo {cuota_diaria} al día: divides {total_ciclo} entre {dias_ciclo} días y listo. Si no pagas, la cuota sube.",
  "Con {cuota_diaria} diarios no duele: {total_ciclo} repartidos en {dias_ciclo} días. Si te atrasas, el interés sigue corriendo.",
  "Paga {cuota_diaria} al día y quedas al día. Son {total_ciclo} en {dias_ciclo} días; si no pagas, el cobro se hace difícil.",
]
renovacion = [
  "Renuevas cuando quieras: solo el {tasa_mensual} al mes y {cuota_diaria} diarios. Sin papeles, sin fila y sin consulta.",
  "Solo el {tasa_mensual} al mes y {cuota_diaria} diarios. Renuevas cuando quieras, sin papeles.",
  "Cuando quieras renuevas: solo el {tasa_mensual} al mes y {cuota_diaria} diarios. Sin fila, sin papeles y sin consulta.",
]
cierre = [
  "Firma hoy y te doy {monto}. Solo necesito tu compromiso y {cuota_diaria} al día.",
  "La plata es tuya hoy: {monto}. Empieza a pagar {cuota_diaria} al día y no hay trámite.",
  "Cierro contigo ahora: {monto} y {cuota_diaria} diarios. Sin papeleo y sin espera.",
]

[negociacion]
# Límites de la negociación de la escena. El código recorta estos valores
# contra los máximos del diseño y no los supera aunque el TOML traiga más:
# cuatro turnos, 15 s en total, 4 s por llamada y 40 palabras por turno.
# Temperatura 0 y sin razonamiento, como el comité; no hay reintentos.
max_turnos = 4
tiempo_total_segundos = 15
tiempo_llamada_segundos = 4
max_palabras = 40
temperatura = 0.0
max_tokens = 400
razonamiento = false

[preguntas]
# Preguntas del público a Pana. La ficha de respuestas fijas se carga en
# `[[preguntas.fijas]]` en la tarea 6.14; aquí quedan los límites y las frases
# que no pueden inventarse. El tiempo total es un punto abierto del diseño: se
# mide con las cuatro rutas y se ajusta aquí sin cambiar el contrato.
umbral_fijo = 0.6
puntaje_minimo = 0.9
max_palabras = 40
tiempo_total_segundos = 8
tiempo_llamada_segundos = 4
max_fragmentos = 3
rechazo = "No tengo información sobre eso; puedo contarles del proyecto o de los productos del banco."
respaldo = "No puedo responder eso ahora mismo; el proyecto está documentado en docs/ y los productos y tasas del banco, en el Tablero."
pii = "Por seguridad no proceso datos personales en este espacio (Ley 1581 de 2012). Puedo contarles del proyecto o de los productos del banco."

[preguntas.proyecto]
# Corpus del paso 2, relativo a la raíz del repositorio. El recuperador solo
# indexa README.md, AGENTS.md, CONSTITUTION.md y los .md de docs/; una ruta
# fuera de esas raíces se ignora aunque esté listada.
rutas = ["README.md", "AGENTS.md", "CONSTITUTION.md", "docs"]
