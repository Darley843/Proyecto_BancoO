# Configuración de la Sucursal (fase 2).
# Solo se documentan aquí los valores; las claves nunca viven en este archivo.

[embeddings]
# Modelo local servido por Ollama: sin clave, sin costo y sin salida a internet.
modelo = "nomic-embed-text-v2-moe"
# URL del cliente. Es `base_url` y no `OLLAMA_HOST`: ese último es la dirección
# de bind del daemon y puede ser 0.0.0.0, que no sirve como destino.
# Si se omite, se toma OLLAMA_BASE_URL y, como respaldo, OLLAMA_HOST.
base_url = "http://127.0.0.1:11434"
# Prefijos de tarea de nomic. Se pueden desactivar para el experimento del Arqueo.
prefijos = true
# Segundos de espera para cada lote de embeddings. En un portátil sin GPU, Ollama
# en CPU tarda cerca de un minuto en vectorizar un lote de 64 fragmentos; 300 s
# deja margen sin permitir que una Ollama colgada bloquee make indice.
timeout_segundos = 300.0

[recuperacion]
# Fragmentos que devuelve el recuperador cuando no se indica k.
k = 5
# Pesos del híbrido; se normalizan a suma 1 antes de pasarlos a EnsembleRetriever.
peso_vectorial = 0.6
peso_bm25 = 0.4

[digiturno]
# Palabras que mandan la pregunta al Tablero (ruta T); se comparan sin tildes.
palabras_tarifas = [
  "cuota",
  "tarifa",
  "cobertura",
  "carencia",
  "descuento",
  "promocion",
  "asistencia",
  "seguro",
  "prima",
  "comision",
]
# Patrones de fuera de alcance (ruta X); se aplican sobre el texto normalizado sin tildes.
patrones_fuera_alcance = [
  '\b(saldo|deuda|extracto|movimientos)\b.*\b(mi|mis|cuenta|tarjeta)\b|\bmi (saldo|deuda|extracto)\b',
  '\b(otro banco|bancolombia|davivienda|bbva|banco de bogota|colpatria)\b',
  '\b(clima|temperatura|lluvia|va a llover)\b',
  '\b(consejo|recomiend\w*|invertir|inversion|acciones|criptomoneda)\b',
  '\b(prompt|instrucciones del sistema|system prompt|ignora (tus|las) instrucciones|revela)\b',
]
