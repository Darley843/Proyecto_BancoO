# Gateway local de OpenClaw y servidor MCP del agente `pana`.
# Sin secretos: el token vive solo en la variable de entorno
# OPENCLAW_GATEWAY_TOKEN. Ver docs/AGENTE_OPENCLAW.md.

[gateway]
# `OPENCLAW_ACTIVO=1` y `OPENCLAW_GATEWAY_TOKEN` habilitan el motor; sin token,
# o con `fallback_forzado = true`, el despachador responde con el grafo.
base_url = "http://127.0.0.1:18789"
modelo = "openclaw:pana"
prefijo_usuario = "wa:"
# 90 s es el techo de un turno con varias herramientas: una respuesta con cifras
# puede encadenar entrevista, gota a gota, negociación y ficha, y la base del
# agente tarda en preparar el turno; la conexión se corta a los 3 s. La cola del
# canal tiene un solo trabajador: si el gateway se cuelga, ese turno espera el
# techo y luego cae al grafo. Sin reintentos: un reintento repetiría el turno.
timeout_segundos = 90.0
reintentos = 0
fallback_forzado = false

[mcp]
# El servidor del agente escucha solo en loopback: nunca en 0.0.0.0.
host = "127.0.0.1"
puerto = 8765
ruta = "/mcp"
