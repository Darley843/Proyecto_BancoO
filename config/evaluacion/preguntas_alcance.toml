# Las 20 preguntas del alcance (docs/ALCANCE.md) para la evaluacion del Q&A.
#
# cobertura:
#   "si"      el corpus tiene el dato; se espera una respuesta con fuente.
#   "parcial" el corpus tiene parte del dato; se espera respuesta o remision.
#   "no"      el corpus no tiene el dato; lo correcto es la frase fija y el canal oficial.
#
# terminos: grupos de terminos esperados en la respuesta. Cada grupo es una
# lista de alternativas (basta una). Se comparan sin tildes ni mayusculas. Es
# una heuristica para ordenar la revision, no reemplaza la revision humana.

