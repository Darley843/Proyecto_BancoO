# Configuracion del corpus. Un solo lugar para cambiar el alcance del scraping.

[site]
name = "Banco de Occidente"
slug = "banco-occidente"
base_url = "https://www.bancodeoccidente.com.co"
sitemap_url = "https://www.bancodeoccidente.com.co/sitemap.xml"
allowed_hosts = ["www.bancodeoccidente.com.co", "bancodeoccidente.com.co"]
language = "es"
# Identificacion. El WAF del sitio responde 403 a cualquier UA que se declare
# bot, aunque robots.txt permita el contenido. Se usa un UA de navegador real y
# la identificacion academica viaja en el header estandar `From` (RFC 9110),
# que el pipeline envia en cada peticion. Sigue siendo un crawler identificado,
# con pausa de cortesia entre peticiones y respeto estricto de robots.txt.
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36"
contact = "darley.idarraga@uao.edu.co"

[crawl]
# Cortesia con el servidor: 1.5 s entre peticiones (los slides sugieren 1-2 s).
# robots.txt del banco no declara Crawl-delay: el valor es decision del proyecto.
delay_seconds = 1.5
timeout_seconds = 30
max_retries = 3
# Tope de seguridad para no martillar el sitio. El sitemap publica ~2.500
# entradas (con duplicados y algunas obsoletas): 3.500 deja margen.
max_urls = 3500
# El sitemap de Liferay es un indice de indices: se expande recursivamente.
max_sitemap_depth = 2
max_sitemaps = 400
# Sin esto no se captura nada que este en Disallow.
respect_robots = true

[crawl.politeness]
# Pausa extra cada N peticiones, por si el sitio responde lento.
pause_every = 50
pause_seconds = 10

[discovery]
# Solo se capturan paginas HTML; los PDF se listan aparte para una fase posterior.
html_extensions = [".html", ".htm", ".shtml", ""]
document_extensions = [".pdf", ".doc", ".docx", ".xls", ".xlsx", ".ppt", ".pptx"]
# Rutas que nunca aportan al corpus (transaccionales, privadas o ruido).
exclude_patterns = [
    "/portaltransaccional",
    "/icbs-web",
    "/AjaxTx",
    "/wps/",
    "/login",
    "/logout",
    "/carrito",
    "/admin",
    "/error",
    "/servlet",
    "/documents/",
    "/image/",
    # Formulario de contacto, no contenido: AGENTS.md prohibe capturar
    # formularios. Se descubrio ya en Bronze, por eso tambien se filtra en Gold.
    "/ayuda/agendar-cita-asesor",
]

[gold]
# Las secciones del checklist del Taller 1.
sections = ["identidad", "oferta", "presencia", "datos", "atencion", "legal", "otros"]
# Minimo de documentos para considerar que una linea es boilerplate.
boilerplate_min_docs = 5
# Fraccion de documentos en la que debe aparecer una linea para ser boilerplate.
boilerplate_ratio = 0.35

[noticias]
# Ventana de la curaduria. `hasta` vacio significa la fecha de ejecucion.
desde = "2025-01-01"
hasta = ""
prensa = "data/noticias/prensa.yaml"
# Maximo de coberturas externas por hecho.
max_por_evento = 2
# Tope de hitos oficiales materiales.
max_oficiales = 40
relevancia_minima = "media"
incluir_dividendos = false
