[project]
name = "banco-occidente-corpus"
version = "0.1.0"
description = "Corpus web de Banco de Occidente: pipeline Medallion (Bronze/Silver/Gold) listo para RAG"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Darley Idarraga", email = "darley.idarraga@uao.edu.co" }
]
requires-python = ">=3.13"
keywords = ["web-scraping", "rag", "corpus", "medallion", "trafilatura", "uv"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.162.0",
    "httpx[http2]>=0.27.2",
    "jsonschema>=4.26.0",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-deepseek>=1.1.1",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "lxml>=5.3.0",
    "pydantic>=2.14.1",
    "pypdfium2>=5.14.0",
    "pyyaml>=6.0.2",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.1",
    "trafilatura>=1.12.2",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# Conteo exacto de tokens (si no esta instalado se usa un estimador)
tokens = ["tiktoken>=0.8.0"]
media = [
    "yt-dlp>=2026.10.21",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "ty>=0.0.91",
]
# Herramienta del agente (MCP), fuera del pipeline: no entra en `uv sync`
# ni en la CI. Se lanza en su propio entorno con `uvx` desde `opencode.json`.

[project.scripts]
corpus = "banco_occidente_corpus.cli:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["test"]
addopts = "-q --strict-markers"
